[project]
name = "nba-trade-desk"
version = "0.1.0"
description = "An agent runs an NBA front office in a synthetic league; a judge grades its trajectories and is validated against human labels."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "motherlode @ git+https://github.com/zacharygking/motherlode@v0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nba-trade-desk = "trade_desk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trade_desk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
